name: Deploy Site
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - data.json
      - status.json
      - blocked.json
      - operator.json      # your DELETE / HIDE / SWITCH decisions
      - company.json       # the company record
      - site_template.html
      - build_site.py
      - .github/workflows/deploy.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Build gated site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
