name: Crawl Solicitations
# The 24/7 engine. Runs a FLEET of parallel sharded workers — each owns its own
# slice of the source list, so no two bots ever redo the same work. Every worker
# also checks control.json (the Mission Control STOP switch) before doing anything.
#
# AI BUDGET DISCIPLINE (the fix for "everything is pending verification").
# The old schedule attempted 12 runs x 4 shards x 60 calls = 2,880 AI calls a day
# against free tiers worth a few hundred. Every provider 429'd, so records were
# stored half-read and the whole register sat unverified.
# Now: 6 runs x 4 shards x 8 calls = 192 calls a day, which still completes ~96
# solicitations FULLY every day. Fewer, finished records beat many broken ones.
on:
  schedule:
    - cron: "17 */4 * * *"   # deep re-crawl slice every 4 hours (6 runs/day)
    - cron: "47 13 * * *"    # one quick live status check daily
  workflow_dispatch:
    inputs:
      mode:
        description: "roots = deep re-crawl | live = quick check | probe = provider self-test"
        type: choice
        options: [roots, live, probe]
        default: roots
      force_sam:
        description: "force a SAM pull even outside the SAM windows"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  # ---- gate: don't start a fleet at all if the operator pressed STOP ----
  gate:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.c.outputs.paused }}
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          P=$(python3 -c "import json;print(str(json.load(open('control.json')).get('paused',False)).lower())" 2>/dev/null || echo false)
          echo "paused=$P" >> "$GITHUB_OUTPUT"
          echo "fleet paused: $P"
      # A broken engine must never be allowed to write to the register.
      - name: Engine self-test
        if: steps.c.outputs.paused != 'true'
        run: |
          pip install --quiet pdfplumber pypdf beautifulsoup4 python-docx openpyxl
          python test_analyzer.py
          python test_pipeline_e2e.py
          python test_repair.py
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 13 * * *" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "mode=roots" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: gate
    if: needs.gate.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]       # 4 bots working different slices at once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # THE CORE SCANNING STANDARD: a bot must be able to read EVERY attachment
      # it finds — Word, Excel, legacy .doc, and scanned PDFs via OCR. Without
      # these the reader silently reports "document unreadable" and the record
      # can never reach VERIFIED.
      - name: Install document readers (OCR, Word, Excel)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils antiword
          pip install --quiet cryptography beautifulsoup4 requests \
            pdfplumber pypdf python-docx openpyxl pytesseract pdf2image
      - name: Confirm the bots can actually read documents
        run: |
          python - <<'EOF'
          import docreader, json, sys
          caps = docreader.capabilities()
          print("document reader capabilities:", json.dumps(caps, indent=1))
          missing = [k for k, v in caps.items() if not v]
          if missing:
              print("::error::cannot read:", ", ".join(missing))
              sys.exit(1)
          print("all document formats readable")
          EOF
      - name: Run crawler (shard ${{ matrix.shard }})
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:   ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:   ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN:    ${{ secrets.GH_MODELS_TOKEN }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY:  ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY:     ${{ secrets.NVIDIA_API_KEY }}
          HF_API_KEY:         ${{ secrets.HF_API_KEY }}
          SAM_API_KEY:        ${{ secrets.SAM_API_KEY }}
          FORCE_SAM:          ${{ (github.event.inputs.force_sam == 'true') && '1' || '0' }}
          UNGM_USER:          ${{ secrets.UNGM_USER }}
          UNGM_PASS:          ${{ secrets.UNGM_PASS }}
          SHARD:              ${{ matrix.shard }}
          SHARDS:             "4"
          MAX_AI_CALLS:       "8"      # 6 runs x 4 shards x 8 = 192 calls/day
          TIME_BUDGET_S:      "1400"
          REPAIR_SHARE:       "0.65"   # finish existing records before finding new ones
          MAX_REPAIR_TRIES:   "3"      # then stop asking and flag it for a human
        run: python crawler.py "${{ needs.gate.outputs.mode }}"
      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            data.json
            status.json
            blocked.json
            state.json
          retention-days: 1

  # ---- merge every shard's findings into one register, then deploy ----
  merge:
    needs: [gate, crawl]
    if: always() && needs.gate.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Merge shards
        run: python merge_shards.py shards
      - name: Commit + redeploy
        run: |
          git config user.name  "mm-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add data.json status.json blocked.json state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "crawl (${{ needs.gate.outputs.mode }}): merged fleet results"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
              -d '{"ref":"main"}' >/dev/null
          fi
