name: Embassy Tracker

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: embassy-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python tracker.py

      - name: Save updated snapshots
        run: |
          git config user.name "embassy-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update snapshots [skip ci]"
          git push
