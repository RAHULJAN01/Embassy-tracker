name: Embassy Tracker

# Runs once a day, and can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily (~01:30 AM US ET / ~11:30 AM IST). Change if you like.
  workflow_dispatch: {}       # the "Run workflow" button

permissions:
  contents: write             # lets the run save updated snapshots back to the repo

concurrency:
  group: embassy-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          # SEND_DAILY_DIGEST: "1"   # uncomment to also get an email on quiet days
        run: python tracker.py

      - name: Save updated snapshots
        run: |
          git config user.name "embassy-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update tracker snapshots [skip ci]"
          git push
